name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt psycopg2-binary requests beautifulsoup4 python-dotenv pytest
          cd web-app && npm ci
          cd ..

      - name: Run integration check
        run: |
          chmod +x tests/scripts/check_unset_pythonpath.sh
          make test

      - name: Run pytest
        run: |
          .venv/bin/pytest -q
